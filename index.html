perty('--mx',e.clientX+'px');deck.style.setProperty('--my',e.clientY+'px')});const c=$('#magic'),x=c.getContext('2d');let parts=[];function resize(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);screenTag.textContent=innerWidth+'×'+innerHeight}addEventListener('resize',resize);resize();function burst(px,py,n){for(let i=0;i<n;i++)parts.push({x:px,y:py,vx:(Math.random()-.5)*(shine?10:5),vy:(Math.random()-.5)*(shine?10:5),life:1,h:Math.random()*360})}function loop(){x.clearRect(0,0,innerWidth,innerHeight);x.globalCompositeOperation='lighter';for(let i=parts.length-1;i>=0;i--){let p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.018;p.life-=shine?.011:.02;x.fillStyle='hsla('+p.h+',100%,65%,'+p.life+')';x.beginPath();x.arc(p.x,p.y,(shine?6:3)*p.life,0,Math.PI*2);x.fill();if(p.life<=0)parts.splice(i,1)}if(shine&&Math.random()<.12)burst(Math.random()*innerWidth,Math.random()*innerHeight,4);requestAnimationFrame(loop)}loop();makeBanks();render();</script></body></html>
