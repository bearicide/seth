<!DOCTYPE html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover'><title>THE MATTMACHINE ∞ HYPER</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#010204;color:#fff;font-family:system-ui,sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}.scan{position:fixed;inset:0;background:repeating-linear-gradient(to bottom,transparent 0 2px,rgba(255,255,255,.08) 3px);mix-blend-mode:screen;pointer-events:none}.app{position:relative;z-index:2;height:100dvh;padding:12px;display:grid;grid-template-rows:auto 1fr}.logo{font-size:clamp(1.4rem,4vw,4rem);font-weight:1000;background:linear-gradient(90deg,#00eaff,#ff2bd6,#ffe600,#39ff14,#9d4dff);background-size:300% 100%;animation:r 8s linear infinite;-webkit-background-clip:text;color:transparent;text-shadow:0 0 30px rgba(0,234,255,.35)}@keyframes r{to{background-position:300% 0}}.machine{display:grid;grid-template-columns:1fr 320px;gap:14px;min-height:0}.deck{position:relative;border-radius:30px;padding:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);backdrop-filter:blur(18px);overflow:hidden;box-shadow:0 0 80px rgba(255,43,214,.18)}.pads{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.pad{position:relative;min-height:15vh;border-radius:24px;border:2px solid currentColor;background:rgba(0,0,0,.5);display:grid;place-items:center;font-size:clamp(1.5rem,4vw,4rem);cursor:pointer;overflow:hidden;transition:.08s}.pad:before{content:'';position:absolute;inset:-40%;background:conic-gradient(from 0deg,transparent,rgba(255,255,255,.2),transparent);animation:s 5s linear infinite}.pad.active{transform:scale(.93);filter:brightness(2)}@keyframes s{to{transform:rotate(360deg)}}.cyan{color:#00eaff}.pink{color:#ff2bd6}.green{color:#39ff14}.yellow{color:#ffe600}.purple{color:#9d4dff}.orange{color:#ff9d00}.red{color:#ff3131}.side{display:grid;gap:12px}.panel{padding:16px;border-radius:24px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(18px)}.btn{min-height:70px;border:none;border-radius:18px;background:rgba(0,0,0,.45);color:#fff;font-weight:1000;cursor:pointer}.btn.on{background:linear-gradient(90deg,#39ff14,#ffe600);color:#000}.meter{height:16px;border-radius:999px;background:#111;overflow:hidden}.fill{height:100%;width:40%;background:linear-gradient(90deg,#00eaff,#ff2bd6,#ffe600);background-size:200% 100%;animation:r 4s linear infinite}.seq{display:grid;grid-template-columns:repeat(16,1fr);gap:5px;margin-top:12px}.step{height:24px;border-radius:8px;background:rgba(255,255,255,.08)}.step.on{background:#ff2bd6;box-shadow:0 0 20px #ff2bd6}.step.now{outline:2px solid #00eaff}.orbs div{position:fixed;border-radius:50%;filter:blur(90px);mix-blend-mode:screen;opacity:.2;animation:f 16s ease-in-out infinite}.orbs .a{width:40vw;height:40vw;background:#ff2bd6;left:-10vw;top:-10vh}.orbs .b{width:30vw;height:30vw;background:#00eaff;right:-5vw;bottom:-10vh}.orbs .c{width:20vw;height:20vw;background:#39ff14;left:40vw;top:45vh}@keyframes f{50%{transform:translateY(-5vh) translateX(4vw) scale(1.1)}}@media(max-width:760px){.machine{grid-template-columns:1fr}.pad{min-height:11vh}}</style></head><body><canvas id='bg'></canvas><canvas id='fx'></canvas><div class='scan'></div><div class='orbs'><div class='a'></div><div class='b'></div><div class='c'></div></div><main class='app'><div class='logo'>THE MATTMACHINE ∞ HYPER</div><section class='machine'><section class='deck'><div class='pads' id='pads'></div><div class='seq' id='seq'></div></section><aside class='side'><div class='panel'><button class='btn on' id='hyper'>HYPER ACTIVE</button></div><div class='panel'><div id='status'>visual overload stable</div><div class='meter'><div class='fill' id='fill'></div></div></div></aside></section></main><script>const pads=document.getElementById('pads'),seq=document.getElementById('seq');const icons=['🥾','⚡','✨','💥','🌀','🔔','🧨','☄','🐻','🌑','🪱','⚙','W','O','R','D'];const cols=['cyan','pink','green','yellow','purple','orange','red','cyan'];for(let i=0;i<16;i++){let p=document.createElement('button');p.className='pad '+cols[i%cols.length];p.innerHTML=icons[i];p.onpointerdown=e=>fire(p,e.clientX,e.clientY);pads.appendChild(p);let s=document.createElement('div');s.className='step';s.onclick=()=>s.classList.toggle('on');seq.appendChild(s)}const ctx=new(window.AudioContext||window.webkitAudioContext)();function fire(el,x,y){ctx.resume();el.classList.add('active');setTimeout(()=>el.classList.remove('active'),140);const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=60+Math.random()*1000;o.type=Math.random()>.5?'square':'sawtooth';g.gain.value=.2;o.connect(g);g.connect(ctx.destination);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.3);o.start();o.stop(ctx.currentTime+.3);burst(x,y,100)}let step=0;setInterval(()=>{let st=[...document.querySelectorAll('.step')];st.forEach(s=>s.classList.remove('now'));st[step].classList.add('now');if(st[step].classList.contains('on')){let p=[...document.querySelectorAll('.pad')][step];fire(p,innerWidth/2,innerHeight/2)}step=(step+1)%16},125);const bg=document.getElementById('bg'),b=bg.getContext('2d'),fx=document.getElementById('fx'),f=fx.getContext('2d');let parts=[];function rs(){[bg,fx].forEach(c=>{c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio});b.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);f.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',rs);rs();let stars=[];for(let i=0;i<400;i++)stars.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,z:Math.random()*2});function burst(x,y,n){for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*22,vy:(Math.random()-.5)*22,life:1,h:Math.random()*360})}function loop(){b.clearRect(0,0,innerWidth,innerHeight);f.clearRect(0,0,innerWidth,innerHeight);stars.forEach(s=>{s.y+=s.z*1.5;if(s.y>innerHeight)s.y=0;b.fillStyle='rgba(255,255,255,'+(.15+s.z/5)+')';b.fillRect(s.x,s.y,s.z*2,s.z*2)});f.globalCompositeOperation='lighter';for(let i=parts.length-1;i>=0;i--){let p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.02;p.life-=.01;f.fillStyle='hsla('+p.h+',100%,65%,'+p.life+')';f.beginPath();f.arc(p.x,p.y,8*p.life,0,Math.PI*2);f.fill();if(p.life<=0)parts.splice(i,1)}for(let i=0;i<8;i++){f.fillStyle='rgba('+(100+i*20)+',0,255,.02)';f.beginPath();f.arc(Math.sin(Date.now()/1000+i)*innerWidth*.35+innerWidth/2,Math.cos(Date.now()/1200+i)*innerHeight*.35+innerHeight/2,220,0,Math.PI*2);f.fill()}requestAnimationFrame(loop)}loop();</script></body></html>
