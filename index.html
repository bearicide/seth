<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover'><title>THE MATTMACHINE</title><style>:root{--bg:#05030a;--panel:#120f1f;--cyan:#00eaff;--pink:#ff2bd6;--green:#39ff14;--yellow:#ffe600}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{font-size:clamp(12px,1vw,18px)}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at top,rgba(255,43,214,.25),transparent 35%),radial-gradient(circle at bottom,rgba(0,234,255,.15),transparent 35%),#020106;color:#fff;font-family:Arial,sans-serif}body{min-height:100dvh}.app{display:grid;grid-template-rows:auto auto 1fr auto;height:100dvh;padding:clamp(8px,2vw,24px);gap:clamp(8px,1vw,18px)}.top{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center}.logo{font-size:clamp(1.2rem,3vw,3rem);font-weight:900;color:var(--cyan);text-shadow:0 0 15px var(--cyan)}.pill{background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:.7rem 1rem;font-size:.9rem}.pads{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:1fr;gap:clamp(8px,1vw,14px)}.pad{aspect-ratio:1/1;border-radius:1.5rem;border:2px solid currentColor;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(0,0,0,.25));display:flex;align-items:center;justify-content:center;font-size:clamp(.8rem,2vw,1.5rem);font-weight:900;cursor:pointer;box-shadow:0 0 18px currentColor;transition:.08s transform,.15s filter}.pad:active,.pad.active{transform:scale(.94);filter:brightness(1.6)}.cyan{color:var(--cyan)}.pink{color:var(--pink)}.green{color:var(--green)}.yellow{color:var(--yellow)}.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.ctrl{background:var(--panel);border-radius:1rem;padding:1rem;border:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;text-align:center;min-height:70px}.bottom{display:grid;grid-template-columns:1fr 1fr;gap:10px}.slider{width:100%}footer{opacity:.7;text-align:center;font-size:.8rem}.seq{display:grid;grid-template-columns:repeat(16,1fr);gap:4px}.step{height:24px;border-radius:6px;background:#1b1830;border:1px solid rgba(255,255,255,.08)}.step.active{background:var(--pink);box-shadow:0 0 12px var(--pink)}@media (orientation:landscape){.app{grid-template-columns:1fr minmax(280px,30vw);grid-template-rows:auto 1fr auto}.top{grid-column:1/3}.pads{height:100%}.side{display:grid;gap:10px}}</style></head><body><div class='app'><div class='top'><div class='logo'>THE MATTMACHINE</div><div class='pill'>BPM 120</div><div class='pill'>BEARGRID LIVE</div></div><div class='pads' id='pads'></div><div class='side'><div class='controls'><button class='ctrl'>REC</button><button class='ctrl'>CHOKE</button><button class='ctrl'>LOOP</button><button class='ctrl'>BANK</button></div><div class='ctrl'><input class='slider' type='range' min='0' max='100' value='75'></div><div class='seq' id='seq'></div></div><footer>MATTBEAR · adaptive performance system</footer></div><script>const padWrap=document.getElementById('pads');const colors=['cyan','pink','green','yellow'];for(let i=0;i<16;i++){const b=document.createElement('button');b.className='pad '+colors[i%4];b.innerText=['KICK','SNARE','HAT','FX','BASS','ARP','VOX','GLITCH'][i%8];b.addEventListener('pointerdown',()=>{b.classList.add('active');setTimeout(()=>b.classList.remove('active'),120);play(120+(i*25))});padWrap.appendChild(b)}const seq=document.getElementById('seq');for(let i=0;i<16;i++){const s=document.createElement('div');s.className='step';s.onclick=()=>s.classList.toggle('active');seq.appendChild(s)}const ctx=new(window.AudioContext||window.webkitAudioContext)();function play(freq){ctx.resume();const o=ctx.createOscillator();const g=ctx.createGain();o.frequency.value=freq;o.type=freq<220?'sine':'square';g.gain.value=.12;o.connect(g);g.connect(ctx.destination);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.22);o.start();o.stop(ctx.currentTime+.22)}</script></body></html>
