<!DOCTYPE html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover'><title>THE MATTMACHINE KIT</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#010204;color:#fff;font-family:system-ui,sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}.scan{position:fixed;inset:0;background:repeating-linear-gradient(to bottom,transparent 0 2px,rgba(255,255,255,.08) 3px);mix-blend-mode:screen;pointer-events:none}.app{position:relative;z-index:2;height:100dvh;padding:12px;display:grid;grid-template-rows:auto 1fr;gap:10px}.logo{font-size:clamp(1.35rem,4vw,4rem);font-weight:1000;background:linear-gradient(90deg,#00eaff,#ff2bd6,#ffe600,#39ff14,#9d4dff);background-size:300% 100%;animation:r 8s linear infinite;-webkit-background-clip:text;color:transparent;text-shadow:0 0 30px rgba(0,234,255,.35)}@keyframes r{to{background-position:300% 0}}.machine{display:grid;grid-template-columns:1fr 320px;gap:14px;min-height:0}.deck{border-radius:30px;padding:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);backdrop-filter:blur(18px);overflow:hidden;box-shadow:0 0 90px rgba(255,43,214,.2)}.pads{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;height:calc(100% - 42px)}.pad{position:relative;min-height:13vh;border-radius:24px;border:2px solid currentColor;background:rgba(0,0,0,.5);display:grid;place-items:center;cursor:pointer;overflow:hidden;transition:.08s;color:#fff;box-shadow:0 0 24px currentColor}.pad:before{content:'';position:absolute;inset:-40%;background:conic-gradient(from 0deg,transparent,rgba(255,255,255,.2),transparent);animation:s 5s linear infinite}.pad.active{transform:scale(.93);filter:brightness(2);box-shadow:0 0 72px currentColor}@keyframes s{to{transform:rotate(360deg)}}.icon{font-size:clamp(1.4rem,4vw,4rem);z-index:1}.name{position:absolute;left:.55rem;bottom:.45rem;font-size:clamp(.6rem,1vw,1rem);font-weight:1000;z-index:1}.state{position:absolute;right:.55rem;top:.4rem;font-size:.72rem;z-index:1}.cyan{color:#00eaff}.pink{color:#ff2bd6}.green{color:#39ff14}.yellow{color:#ffe600}.purple{color:#9d4dff}.orange{color:#ff9d00}.red{color:#ff3131}.side{display:grid;gap:12px;grid-template-rows:auto auto auto 1fr}.panel{padding:16px;border-radius:24px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(18px)}.row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.btn{min-height:64px;border:none;border-radius:18px;background:rgba(0,0,0,.45);color:#fff;font-weight:1000;cursor:pointer}.btn.on{background:linear-gradient(90deg,#39ff14,#ffe600);color:#000}.meter{height:16px;border-radius:999px;background:#111;overflow:hidden}.fill{height:100%;width:40%;background:linear-gradient(90deg,#00eaff,#ff2bd6,#ffe600);background-size:200% 100%;animation:r 4s linear infinite}.seq{display:grid;grid-template-columns:repeat(16,1fr);gap:5px;margin-top:12px}.step{height:24px;border-radius:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);cursor:pointer}.step.on{background:#ff2bd6;box-shadow:0 0 20px #ff2bd6}.step.now{outline:2px solid #00eaff}label{display:grid;gap:4px;font-size:.75rem;font-weight:900}input[type=range]{width:100%;accent-color:#ff2bd6}.orbs div{position:fixed;border-radius:50%;filter:blur(90px);mix-blend-mode:screen;opacity:.22;animation:f 16s ease-in-out infinite}.orbs .a{width:40vw;height:40vw;background:#ff2bd6;left:-10vw;top:-10vh}.orbs .b{width:30vw;height:30vw;background:#00eaff;right:-5vw;bottom:-10vh}.orbs .c{width:20vw;height:20vw;background:#39ff14;left:40vw;top:45vh}@keyframes f{50%{transform:translateY(-5vh) translateX(4vw) scale(1.1)}}@media(max-width:760px){.machine{grid-template-columns:1fr}.pad{min-height:10vh}.side{grid-template-rows:auto auto auto}}@media(prefers-reduced-motion:reduce){.pad:before,.orbs div,.fill,.logo{animation:none}}</style></head><body><canvas id='bg'></canvas><canvas id='fx'></canvas><div class='scan'></div><div class='orbs'><div class='a'></div><div class='b'></div><div class='c'></div></div><main class='app'><div class='logo'>THE MATTMACHINE ∞ KIT</div><section class='machine'><section class='deck'><div class='pads' id='pads'></div><div class='seq' id='seq'></div></section><aside class='side'><div class='panel row'><button class='btn on' id='kitBtn'>KIT</button><button class='btn' id='synthBtn'>SYNTH</button><button class='btn on' id='chokeBtn'>CHOKE</button><button class='btn on' id='hyperBtn'>HYPER</button></div><div class='panel'><div id='status'>kit loader active / no doubling</div><div class='meter'><div class='fill' id='fill'></div></div></div><div class='panel'><label>VOLUME<input id='vol' type='range' min='0' max='1' step='.01' value='.9'></label><label>PITCH<input id='pitch' type='range' min='-12' max='12' step='1' value='0'></label></div></aside></section></main><script>const KIT=[['🥾','KICK','assets/kit/01-heavy-kick-c.wav',60],['⚡','SNARE','assets/kit/02-grit-snare.wav',180],['✨','HAT','assets/kit/03-tight-hat.wav',900],['🌧','OPEN HAT','assets/kit/04-open-hat.wav',700],['🧨','LOW KICK','assets/kit/05-low-kick-f.wav',74],['💥','CLAP','assets/kit/06-clap-snare-layer.wav',260],['🔩','METAL','assets/kit/07-metal-perc.wav',420],['🪵','WOOD','assets/kit/08-wood-block-perc.wav',330],['☄','ALT KICK 1','assets/kit/09-alt-kick.wav',90],['🧲','ALT KICK 2','assets/kit/10-alt-kick.wav',110],['🫀','ALT KICK 3','assets/kit/11-alt-kick.wav',130],['🐻','ALT KICK 4','assets/kit/12-alt-kick.wav',150],['🪓','ALT SNARE 1','assets/kit/13-alt-snare.wav',210],['🎯','ALT SNARE 2','assets/kit/14-alt-snare.wav',240],['🪙','ALT SNARE 3','assets/kit/15-alt-snare.wav',280],['👁','ALT SNARE 4','assets/kit/16-alt-snare.wav',320]];const colors=['cyan','pink','green','yellow','purple','orange','red','cyan'];const pads=document.getElementById('pads'),seq=document.getElementById('seq'),statusEl=document.getElementById('status'),fill=document.getElementById('fill');let useKit=true,choke=true,hyper=true,step=0,buffers=[],active=[];const ctx=new(window.AudioContext||window.webkitAudioContext)();const master=ctx.createGain();master.gain.value=.9;master.connect(ctx.destination);document.getElementById('vol').oninput=e=>master.gain.value=+e.target.value;async function loadKit(){statusEl.textContent='loading kit sounds...';buffers=await Promise.all(KIT.map(async k=>{try{const r=await fetch(k[2]);if(!r.ok)throw Error('missing');return await ctx.decodeAudioData(await r.arrayBuffer())}catch(e){return null}}));const loaded=buffers.filter(Boolean).length;statusEl.textContent=loaded?loaded+' kit sounds loaded / no doubling':'kit files missing - synth fallback ready'}function stopActive(){active.forEach(n=>{try{n.stop()}catch(e){}});active=[]}function trigger(i,el,e){ctx.resume();if(choke)stopActive();el.classList.add('active');setTimeout(()=>el.classList.remove('active'),120);fill.style.width=(30+Math.random()*70)+'%';statusEl.textContent=(useKit&&buffers[i]?'KIT':'SYNTH')+' / '+KIT[i][1];burst(e.clientX,e.clientY,hyper?80:30);if(useKit&&buffers[i]){const src=ctx.createBufferSource(),g=ctx.createGain();src.buffer=buffers[i];src.playbackRate.value=Math.pow(2,+document.getElementById('pitch').value/12);g.gain.value=.95;src.connect(g);g.connect(master);src.start();active.push(src);src.onended=()=>active=active.filter(x=>x!==src)}else{const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=KIT[i][3];o.type=i<4?'sine':'square';g.gain.value=.18;o.connect(g);g.connect(master);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.28);o.start();o.stop(ctx.currentTime+.28);active.push(o)}}function render(){KIT.forEach((s,i)=>{let p=document.createElement('button');p.className='pad '+colors[i%colors.length];p.innerHTML='<div class=state>'+String(i+1).padStart(2,'0')+'</div><div class=icon>'+s[0]+'</div><div class=name>'+s[1]+'</div>';p.onpointerdown=e=>trigger(i,p,e);pads.appendChild(p);let q=document.createElement('div');q.className='step';q.onclick=()=>q.classList.toggle('on');seq.appendChild(q)})}setInterval(()=>{let st=[...document.querySelectorAll('.step')];st.forEach(s=>s.classList.remove('now'));st[step].classList.add('now');if(st[step].classList.contains('on'))trigger(step,[...document.querySelectorAll('.pad')][step],{clientX:innerWidth/2,clientY:innerHeight/2});step=(step+1)%16},125);document.getElementById('kitBtn').onclick=e=>{useKit=true;e.target.classList.add('on');document.getElementById('synthBtn').classList.remove('on')};document.getElementById('synthBtn').onclick=e=>{useKit=false;e.target.classList.add('on');document.getElementById('kitBtn').classList.remove('on')};document.getElementById('chokeBtn').onclick=e=>{choke=!choke;e.target.classList.toggle('on',choke)};document.getElementById('hyperBtn').onclick=e=>{hyper=!hyper;e.target.classList.toggle('on',hyper)};const bg=document.getElementById('bg'),b=bg.getContext('2d'),fx=document.getElementById('fx'),f=fx.getContext('2d');let parts=[],stars=[];function rs(){[bg,fx].forEach(c=>{c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio});b.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);f.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',rs);rs();for(let i=0;i<360;i++)stars.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,z:Math.random()*2});function burst(x,y,n){for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*(hyper?20:8),vy:(Math.random()-.5)*(hyper?20:8),life:1,h:Math.random()*360})}function loop(){b.clearRect(0,0,innerWidth,innerHeight);f.clearRect(0,0,innerWidth,innerHeight);stars.forEach(s=>{s.y+=s.z*(hyper?1.7:.8);if(s.y>innerHeight)s.y=0;b.fillStyle='rgba(255,255,255,'+(.15+s.z/5)+')';b.fillRect(s.x,s.y,s.z*2,s.z*2)});f.globalCompositeOperation='lighter';for(let i=parts.length-1;i>=0;i--){let p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.02;p.life-=hyper?.01:.02;f.fillStyle='hsla('+p.h+',100%,65%,'+p.life+')';f.beginPath();f.arc(p.x,p.y,(hyper?8:4)*p.life,0,Math.PI*2);f.fill();if(p.life<=0)parts.splice(i,1)}if(hyper&&Math.random()<.08)burst(Math.random()*innerWidth,Math.random()*innerHeight,5);requestAnimationFrame(loop)}render();loadKit();loop();</script></body></html>
