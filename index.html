<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>THE MATTMACHINE - BearGrid</title>
<style>
:root{--cyan:#00eaff;--pink:#ff2bd6;--green:#39ff14;--yellow:#ffe600;--purple:#9d4dff;--orange:#ff9d00;--red:#ff3131;--glow:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html{font-size:clamp(12px,1.05vw,19px)}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020106;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}
body{min-height:100dvh;touch-action:manipulation;background:radial-gradient(circle at 20% 10%,rgba(255,43,214,.22),transparent 30%),radial-gradient(circle at 80% 90%,rgba(0,234,255,.18),transparent 34%),#020106}
#magic{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;filter:saturate(1.25)}
body:before{content:"";position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.08;background:repeating-linear-gradient(to bottom,transparent 0 3px,rgba(255,255,255,.45) 4px)}
.app{position:relative;z-index:2;height:100dvh;width:100vw;display:grid;grid-template-rows:auto minmax(0,1fr);padding:calc(env(safe-area-inset-top) + clamp(8px,1.5vw,22px)) clamp(8px,1.5vw,22px) calc(env(safe-area-inset-bottom) + clamp(8px,1.5vw,22px));gap:clamp(8px,1vw,16px)}
.top{display:grid;grid-template-columns:1fr auto auto auto;gap:clamp(6px,.8vw,12px);align-items:center}.logo{font-weight:1000;letter-spacing:.05em;font-size:clamp(1.15rem,3.5vw,3.6rem);line-height:.95;background:linear-gradient(90deg,var(--cyan),var(--pink),var(--yellow),var(--green));-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 25px rgba(0,234,255,.25);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pill,.button,.tiny{border:1px solid rgba(255,255,255,.16);background:linear-gradient(180deg,rgba(255,255,255,.11),rgba(0,0,0,.35));box-shadow:inset 0 0 22px rgba(255,255,255,.04),0 0 calc(var(--glow)*.7) rgba(0,234,255,.12);backdrop-filter:blur(10px);border-radius:999px;color:#fff}.pill{padding:.62rem .82rem;font-weight:800;font-size:clamp(.65rem,1.25vw,.95rem);white-space:nowrap}.pill.hot{color:var(--pink);text-shadow:0 0 12px var(--pink)}
.machine{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(230px,28vw);gap:clamp(8px,1vw,16px)}.deck{min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:clamp(8px,1vw,14px);padding:clamp(8px,1vw,14px);border:1px solid rgba(255,255,255,.12);border-radius:clamp(18px,2vw,32px);background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(0,0,0,.38));box-shadow:0 0 40px rgba(255,43,214,.16),inset 0 0 34px rgba(0,234,255,.06);overflow:hidden}.bankbar{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(6px,.8vw,10px)}.button{border-radius:1rem;padding:.75rem .55rem;font-weight:1000;font-size:clamp(.67rem,1.25vw,.95rem);cursor:pointer}.button.active{color:#000;background:linear-gradient(90deg,var(--cyan),var(--pink));box-shadow:0 0 22px var(--pink),0 0 22px var(--cyan)}
.pads{min-height:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:clamp(7px,1vw,14px)}.pad{position:relative;min-width:0;min-height:0;border:2px solid currentColor;border-radius:clamp(14px,2vw,28px);background:radial-gradient(circle at 35% 20%,rgba(255,255,255,.18),transparent 32%),linear-gradient(180deg,rgba(255,255,255,.08),rgba(0,0,0,.54));display:grid;place-items:center;padding:.35rem;color:#fff;cursor:pointer;box-shadow:0 0 var(--glow) currentColor,inset 0 0 30px rgba(255,255,255,.06);overflow:hidden;transition:transform .07s ease,filter .12s ease,box-shadow .12s ease}.pad:before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,transparent,rgba(255,255,255,.18),transparent);opacity:.38;transform:translateX(-120%);transition:.2s}.pad.active:before{transform:translateX(120%)}.pad.active{transform:scale(.945);filter:brightness(1.65) saturate(1.5);box-shadow:0 0 calc(var(--glow)*2.4) currentColor,inset 0 0 36px currentColor}.pad .icon{font-size:clamp(1.1rem,3.2vw,3.6rem);line-height:1;text-shadow:0 0 18px currentColor}.pad .name{position:absolute;left:.48rem;bottom:.45rem;font-weight:1000;font-size:clamp(.58rem,1.1vw,.95rem);letter-spacing:.04em;text-shadow:0 0 10px #000}.pad .state{position:absolute;top:.42rem;right:.48rem;font-size:.68rem;opacity:.74}.cyan{color:var(--cyan)}.pink{color:var(--pink)}.green{color:var(--green)}.yellow{color:var(--yellow)}.purple{color:var(--purple)}.orange{color:var(--orange)}.red{color:var(--red)}
.seq{display:grid;grid-template-columns:repeat(16,1fr);gap:clamp(3px,.45vw,7px)}.step{height:clamp(20px,3vh,36px);border-radius:.55rem;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.065);box-shadow:inset 0 0 12px rgba(0,0,0,.4);cursor:pointer}.step.on{background:var(--pink);box-shadow:0 0 18px var(--pink)}.step.now{outline:2px solid var(--cyan);filter:brightness(1.5)}
.side{min-height:0;display:grid;grid-template-rows:auto auto auto 1fr auto;gap:clamp(8px,1vw,14px)}.panel{border:1px solid rgba(255,255,255,.12);border-radius:clamp(16px,2vw,28px);background:rgba(12,10,24,.74);padding:clamp(10px,1.1vw,16px);box-shadow:0 0 36px rgba(0,234,255,.08),inset 0 0 30px rgba(255,255,255,.035);backdrop-filter:blur(10px)}.controls{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.bigbtn{min-height:clamp(48px,7vh,86px);border-radius:1rem;border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.34);color:#fff;font-weight:1000;font-size:clamp(.72rem,1.3vw,1rem);cursor:pointer}.bigbtn.on{color:#000;background:linear-gradient(90deg,var(--green),var(--yellow));box-shadow:0 0 24px var(--green)}.meters{display:grid;gap:10px}.meter{height:14px;border-radius:999px;background:#161326;overflow:hidden;border:1px solid rgba(255,255,255,.1)}.fill{height:100%;width:40%;background:linear-gradient(90deg,var(--cyan),var(--pink));box-shadow:0 0 18px var(--pink)}label{display:grid;gap:4px;font-size:.75rem;font-weight:900;letter-spacing:.08em;color:rgba(255,255,255,.72)}input[type=range]{width:100%;accent-color:var(--pink)}.readout{font-size:clamp(.85rem,1.5vw,1.25rem);font-weight:1000;color:var(--cyan);text-shadow:0 0 12px var(--cyan)}.info{display:grid;place-items:center;text-align:center;min-height:0;color:rgba(255,255,255,.86);font-weight:800;line-height:1.25}.info b{color:var(--pink);text-shadow:0 0 12px var(--pink)}.foot{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;opacity:.78;font-size:.78rem;letter-spacing:.05em}.tiny{padding:.45rem .7rem;font-size:.72rem}
@media (max-width:760px){.app{grid-template-rows:auto minmax(0,1fr)}.top{grid-template-columns:1fr auto}.top .pill:nth-child(3),.top .pill:nth-child(4){display:none}.machine{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}.side{grid-template-rows:auto auto auto}.info{display:none}.controls{grid-template-columns:repeat(4,1fr)}.bigbtn{min-height:48px;font-size:.68rem}.panel.hide-mobile{display:none}.logo{font-size:clamp(1rem,7vw,2rem)}.pad .icon{font-size:clamp(1.35rem,8vw,2.8rem)}}
@media (max-height:620px){.pill{padding:.45rem .65rem}.panel{padding:8px}.step{height:18px}.pad .name{font-size:.55rem}.controls{gap:6px}.bigbtn{min-height:38px}}
</style>
</head>
<body>
<canvas id="magic"></canvas>
<main class="app">
<header class="top"><div class="logo">THE MATTMACHINE</div><div class="pill hot" id="bankName">DRUMS</div><div class="pill" id="bpmRead">120 BPM</div><div class="pill">BEARGRID LIVE</div></header>
<section class="machine"><div class="deck"><nav class="bankbar" id="banks"></nav><div class="pads" id="pads"></div><div class="seq" id="seq"></div></div><aside class="side"><section class="panel controls"><button class="bigbtn" id="recBtn">REC</button><button class="bigbtn on" id="chokeBtn">CHOKE</button><button class="bigbtn on" id="quantBtn">QUANT</button><button class="bigbtn" id="shineBtn">SHINE</button></section><section class="panel meters hide-mobile"><div class="readout" id="status">ready / enchanted</div><div class="meter"><div class="fill" id="energy"></div></div></section><section class="panel"><label>VOLUME <input id="vol" type="range" min="0" max="1" step=".01" value=".72"></label><br><label>PITCH <input id="pitch" type="range" min="-12" max="12" step="1" value="0"></label><br><label>DIRT <input id="dirt" type="range" min="0" max="1" step=".01" value=".18"></label></section><section class="panel info"><div>tap pads, set steps, toggle <b>SHINE</b>. Sequencer steps fire the active bank. This scales across phone, tablet, desktop, and projector.</div></section><footer class="foot"><span>MATTBEAR · adaptive cyber instrument</span><span class="tiny" id="screenTag">screen</span></footer></aside></section>
</main>
<script>
const $=s=>document.querySelector(s),pads=$('#pads'),banks=$('#banks'),seq=$('#seq'),bankName=$('#bankName'),status=$('#status'),energy=$('#energy'),screenTag=$('#screenTag');
const colors=['cyan','pink','green','yellow','purple','orange','red','cyan'];
const BANKS={DRUMS:[['🥾','KICK',58],['🪓','SNARE',170],['✨','HAT',860],['⚡','CLAP',260],['🧨','BOOM',74],['🔩','RIM',330],['🌧','SHAKE',1200],['🌀','FILL',420],['🦴','THUD',92],['🔔','BELL',980],['🪙','COIN',660],['💥','HIT',210],['🫧','POP',500],['☄','DROP',48],['🧲','PULL',140],['👁','RITUAL',300]],BASS:[['🐻','SUB',42],['🕳','LOW',55],['🪱','WOB',67],['🧱','GRIT',82],['🌑','DRONE',96],['🔊','PULSE',110],['🛸','GLIDE',124],['⚙','MOTOR',138],['⛓','CHAIN',154],['🫀','HEART',72],['🧪','ACID',180],['🌊','WAVE',205],['🔮','ROOT',240],['🧬','FOLD',275],['🚨','SIREN',310],['🖤','DEEP',36]],KEYS:[['W','WORD',261],['O','OPEN',293],['R','RISE',329],['D','DARK',349],['P','PLAY',392],['L','LIFT',440],['A','AIR',493],['Y','YELL',523],['✦','STAB',587],['✧','CHORD',659],['☽','MOON',698],['☀','SUN',784],['♢','GLASS',880],['♧','BLOOM',987],['♤','GHOST',1046],['♡','LIGHT',1174]],FX:[['💿','VINYL',220],['⏪','REWIND',180],['📼','TAPE',120],['⚠','GLITCH',440],['🌪','SWIRL',330],['🧊','FREEZE',640],['🔥','BURN',760],['👻','GHOST',510],['🪄','SPELL',880],['🧿','WARD',700],['🦠','STATIC',1300],['🕯','HUM',95],['🌈','PRISM',990],['🧯','STOP',60],['☢','FIZZ',560],['🌌','SPACE',40]]};
let bank='DRUMS',choke=true,quant=true,shine=false,step=0,activeLoop=null,lastEnergy=0;const ctx=new(window.AudioContext||window.webkitAudioContext)(),master=ctx.createGain(),comp=ctx.createDynamicsCompressor();master.gain.value=.72;master.connect(comp);comp.connect(ctx.destination);$('#vol').oninput=e=>master.gain.value=+e.target.value;function pitchMul(){return Math.pow(2,+$('#pitch').value/12)}
function makeBanks(){Object.keys(BANKS).forEach(k=>{let b=document.createElement('button');b.className='button'+(k===bank?' active':'');b.textContent=k;b.onclick=()=>{bank=k;render();burst(innerWidth/2,80,18)};banks.appendChild(b)})}
function render(){bankName.textContent=bank;[...banks.children].forEach(b=>b.classList.toggle('active',b.textContent===bank));pads.innerHTML='';BANKS[bank].forEach((p,i)=>{let b=document.createElement('button');b.className='pad '+colors[i%colors.length];b.innerHTML='<div class="state">'+String(i+1).padStart(2,'0')+'</div><div class="icon">'+p[0]+'</div><div class="name">'+p[1]+'</div>';b.onpointerdown=e=>trigger(i,b,e);pads.appendChild(b)})}
function trigger(i,el,e){ctx.resume();const fire=()=>playVoice(BANKS[bank][i][2],i,el,e);if(quant){const t=60000/120/4;setTimeout(fire,t-(performance.now()%t))}else fire()}
function playVoice(freq,i,el,e){if(choke&&activeLoop){try{activeLoop.stop()}catch{} activeLoop=null}el?.classList.add('active');setTimeout(()=>el?.classList.remove('active'),150);navigator.vibrate?.(12);lastEnergy=Math.min(100,lastEnergy+18);energy.style.width=lastEnergy+'%';status.textContent=bank+' / '+BANKS[bank][i][1];const f=freq*pitchMul(),now=ctx.currentTime,osc=ctx.createOscillator(),gain=ctx.createGain(),filter=ctx.createBiquadFilter();filter.type='lowpass';filter.frequency.value=shine?2200+f*2:1400+f;osc.type=bank==='BASS'?'sawtooth':bank==='FX'?'triangle':f<120?'sine':'square';osc.frequency.setValueAtTime(f,now);if(shine)osc.frequency.exponentialRampToValueAtTime(Math.max(30,f*(.5+Math.random()*1.8)),now+.18);gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(.18+(+$('#dirt').value*.16),now+.015);gain.gain.exponentialRampToValueAtTime(.0001,now+(bank==='BASS'?.55:.24));osc.connect(filter);filter.connect(gain);gain.connect(master);osc.start(now);osc.stop(now+(bank==='BASS'?.58:.28));if(bank==='BASS'||BANKS[bank][i][1].includes('DRONE'))activeLoop=osc;const r=el?.getBoundingClientRect?.()||{left:innerWidth/2,top:innerHeight/2,width:1,height:1};burst(e?.clientX||r.left+r.width/2,e?.clientY||r.top+r.height/2,shine?34:16)}
for(let i=0;i<16;i++){let s=document.createElement('button');s.className='step';s.onclick=()=>s.classList.toggle('on');seq.appendChild(s)}setInterval(()=>{const steps=[...seq.children];steps.forEach(x=>x.classList.remove('now'));steps[step].classList.add('now');if(steps[step].classList.contains('on'))playVoice(BANKS[bank][step%16][2],step%16,[...pads.children][step%16],{clientX:innerWidth/2,clientY:innerHeight/2});step=(step+1)%16;lastEnergy=Math.max(4,lastEnergy*.88);energy.style.width=lastEnergy+'%'},125);
$('#chokeBtn').onclick=e=>{choke=!choke;e.currentTarget.classList.toggle('on',choke)};$('#quantBtn').onclick=e=>{quant=!quant;e.currentTarget.classList.toggle('on',quant)};$('#shineBtn').onclick=e=>{shine=!shine;e.currentTarget.classList.toggle('on',shine);document.documentElement.style.setProperty('--glow',shine?'32px':'18px');status.textContent=shine?'shine mode active':'ready / enchanted'};$('#recBtn').onclick=async e=>{e.currentTarget.classList.toggle('on');try{await navigator.mediaDevices.getUserMedia({audio:true});status.textContent='mic open / assign coming next'}catch{status.textContent='mic blocked'}};addEventListener('keydown',e=>{const map='1234567890qwerty';const i=map.indexOf(e.key.toLowerCase());if(i>-1&&i<16)trigger(i,[...pads.children][i],{})});
const c=$('#magic'),x=c.getContext('2d');let parts=[];function resize(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);screenTag.textContent=innerWidth+'×'+innerHeight}addEventListener('resize',resize);resize();function burst(px,py,n){for(let i=0;i<n;i++)parts.push({x:px,y:py,vx:(Math.random()-.5)*(shine?9:5),vy:(Math.random()-.5)*(shine?9:5),life:1,h:Math.random()*360})}function loop(){x.clearRect(0,0,innerWidth,innerHeight);x.globalCompositeOperation='lighter';for(let i=parts.length-1;i>=0;i--){let p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.02;p.life-=shine?.012:.022;x.fillStyle='hsla('+p.h+',100%,65%,'+p.life+')';x.beginPath();x.arc(p.x,p.y,(shine?5:3)*p.life,0,Math.PI*2);x.fill();if(p.life<=0)parts.splice(i,1)}if(shine&&Math.random()<.09)burst(Math.random()*innerWidth,Math.random()*innerHeight,4);requestAnimationFrame(loop)}loop();makeBanks();render();
</script>
</body>
</html>
